<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cart - NovaPhone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
      body {
        background: linear-gradient(135deg, #020617, #111827 50%, #0f172a);
        color: #e2e8f0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .cart-card {
        background: rgba(15, 23, 42, 0.92);
        border-radius: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 18px 40px rgba(2, 8, 23, 0.4);
      }
      .cart-item {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 1rem;
        margin-bottom: 1rem;
      }
      .price {
        color: #5eead4;
        font-weight: 700;
      }
      .auth-menu-wrapper {
        position: relative;
        display: inline-block;
      }
      .auth-menu-panel {
        position: absolute;
        top: calc(100% + 0.6rem);
        right: 0;
        min-width: 240px;
        padding: 0.9rem;
        border-radius: 1rem;
        background: rgba(2, 6, 23, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 32px rgba(2, 8, 23, 0.35);
        display: none;
        z-index: 1050;
      }
      .auth-menu-wrapper:hover .auth-menu-panel,
      .auth-menu-wrapper:focus-within .auth-menu-panel {
        display: block;
      }
      .auth-profile-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.55rem 0.85rem;
        border-radius: 999px;
        border: 1px solid rgba(34, 211, 238, 0.25);
        background: rgba(34, 211, 238, 0.15);
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-phone-fill"></i> NovaPhone</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link active" href="cart.html">Cart</a></li>
          </ul>
          <div class="d-flex gap-2 align-items-center">
            <a class="btn btn-outline-light" href="cart.html">Cart <span class="badge text-bg-light" id="cartCount">0</span></a>
            <div id="authContainer"></div>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="cart-card p-4">
            <h1 class="h3 fw-bold mb-4">My Cart</h1>
            <div id="cartItems"></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="cart-card p-4">
            <h3 class="h5 mb-3">Order summary</h3>
            <div class="d-flex justify-content-between mb-2">
              <span class="text-secondary">Items</span>
              <span id="itemCount">0</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span class="text-secondary">Shipping</span>
              <span>Free</span>
            </div>
            <hr />
            <div class="d-flex justify-content-between fw-bold fs-5">
              <span>Total</span>
              <span class="price" id="totalPrice">$0</span>
            </div>
            <button class="btn btn-info text-dark fw-semibold w-100 mt-4">Checkout</button>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function getCart() {
        return JSON.parse(localStorage.getItem("cart") || "[]");
      }

      function saveCart(cart) {
        localStorage.setItem("cart", JSON.stringify(cart));
      }

      function renderCartCount() {
        const count = getCart().reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById("cartCount").textContent = count;
      }

      function getCurrentUser() {
        return JSON.parse(localStorage.getItem("currentUser") || "null");
      }

      function renderAuthMenu() {
        const container = document.getElementById("authContainer");
        if (!container) return;

        const currentUser = getCurrentUser();
        if (currentUser) {
          container.innerHTML = `
            <div class="auth-menu-wrapper">
              <button class="auth-profile-pill btn" type="button">
                <i class="bi bi-person-circle"></i>
                <span>${currentUser.fullName.split(" ")[0]}</span>
              </button>
              <div class="auth-menu-panel">
                <div class="fw-semibold">${currentUser.fullName}</div>
                <div class="small text-secondary mb-2">${currentUser.email}</div>
                <div class="small text-secondary mb-3">${currentUser.phone || "No phone provided"}</div>
                <a class="btn btn-sm btn-outline-light w-100 mb-2" href="profile.html">View profile</a>
                <button class="btn btn-sm btn-danger w-100" id="logoutBtn">Logout</button>
              </div>
            </div>
          `;

          const logoutButton = container.querySelector("#logoutBtn");
          if (logoutButton) {
            logoutButton.addEventListener("click", function () {
              localStorage.removeItem("currentUser");
              renderAuthMenu();
            });
          }
        } else {
          container.innerHTML = `
            <div class="d-flex gap-2">
              <a class="btn btn-warning" href="login.html">Login</a>
              <a class="btn btn-outline-light" href="register.html">Create account</a>
            </div>
          `;
        }
      }

      function renderCart() {
        const cart = getCart();
        const cartItems = document.getElementById("cartItems");
        if (!cart.length) {
          cartItems.innerHTML = '<div class="text-secondary">Your cart is empty. Visit the home page to add premium phones.</div>';
          document.getElementById("itemCount").textContent = "0";
          document.getElementById("totalPrice").textContent = "$0";
          renderCartCount();
          return;
        }

        cartItems.innerHTML = cart.map((item) => `
          <div class="cart-item">
            <div class="d-flex justify-content-between align-items-start">
              <div>
                <h4 class="h6 mb-1">${item.name}</h4>
                <p class="text-secondary mb-2">${item.description}</p>
                <div class="d-flex gap-2 align-items-center">
                  <button class="btn btn-sm btn-outline-light" onclick="changeQty(${item.id}, -1)">-</button>
                  <span class="fw-semibold">${item.quantity}</span>
                  <button class="btn btn-sm btn-outline-light" onclick="changeQty(${item.id}, 1)">+</button>
                </div>
              </div>
              <div class="text-end">
                <div class="price">$${item.price * item.quantity}</div>
                <button class="btn btn-sm btn-outline-danger mt-2" onclick="removeItem(${item.id})">Remove</button>
              </div>
            </div>
          </div>
        `).join("");

        const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
        document.getElementById("itemCount").textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById("totalPrice").textContent = `$${total}`;
        renderCartCount();
      }

      function changeQty(productId, delta) {
        const cart = getCart();
        const item = cart.find((entry) => entry.id === productId);
        if (!item) return;
        item.quantity += delta;
        if (item.quantity <= 0) {
          const index = cart.findIndex((entry) => entry.id === productId);
          cart.splice(index, 1);
        }
        saveCart(cart);
        renderCart();
      }

      function removeItem(productId) {
        const cart = getCart().filter((item) => item.id !== productId);
        saveCart(cart);
        renderCart();
      }

      renderCart();
      renderAuthMenu();
    </script>
  </body>
</html>

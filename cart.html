<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cart | NovaPhone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%); }
      .navbar-brand { font-weight: 800; color: #2563eb !important; }
      .card { border: 0; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08); border-radius: 1.2rem; }
      .cart-item { border-bottom: 1px solid #e5e7eb; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">NovaPhone</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link active" href="cart.html">Cart <span id="cartCount" class="badge bg-primary">0</span></a></li>
          </ul>
          <div id="navUser" class="text-muted small"></div>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h2 class="fw-bold mb-0">My cart</h2>
              <button id="clearCart" class="btn btn-outline-secondary btn-sm">Clear cart</button>
            </div>
            <div id="cartItems"></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card p-4">
            <h4 class="fw-bold mb-3">Order summary</h4>
            <div class="d-flex justify-content-between mb-2"><span>Items</span><span id="summaryItems">0</span></div>
            <div class="d-flex justify-content-between mb-2"><span>Shipping</span><span>Free</span></div>
            <div class="d-flex justify-content-between mb-3"><span>Total</span><span id="summaryTotal">$0</span></div>
            <button class="btn btn-primary w-100">Checkout</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
      <div class="container text-center text-md-start">
        <div class="row">
          <div class="col-md-6">
            <h5>NovaPhone</h5>
            <p class="text-white-50 mb-0">Modern mobile experiences for students, families, and professionals.</p>
          </div>
          <div class="col-md-6 text-md-end mt-3 mt-md-0">
            <a href="index.html" class="text-white-50 me-3">Home</a>
            <a href="contact.html" class="text-white-50 me-3">Contact</a>
            <a href="cart.html" class="text-white-50">Cart</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function getCart() {
        return JSON.parse(localStorage.getItem('novaCart') || '[]');
      }
      function saveCart(cart) {
        localStorage.setItem('novaCart', JSON.stringify(cart));
      }
      function updateCartBadge() {
        const count = getCart().length;
        const badge = document.getElementById('cartCount');
        if (badge) badge.textContent = count;
      }
      function setUserGreeting() {
        const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
        const box = document.getElementById('navUser');
        if (box) {
          box.innerHTML = user ? `Welcome, <strong>${user.fullName}</strong>` : '<a href="login.html" class="text-decoration-none text-primary">Login first</a>';
        }
      }
      function renderCart() {
        const cart = getCart();
        const container = document.getElementById('cartItems');
        const summaryItems = document.getElementById('summaryItems');
        const summaryTotal = document.getElementById('summaryTotal');
        if (!cart.length) {
          container.innerHTML = '<div class="text-muted py-4">Your cart is currently empty. Visit the home page to add products.</div>';
          summaryItems.textContent = '0';
          summaryTotal.textContent = '$0';
          updateCartBadge();
          return;
        }
        let total = 0;
        let itemCount = 0;
        container.innerHTML = cart.map((item) => {
          total += item.price * item.quantity;
          itemCount += item.quantity;
          return `
            <div class="cart-item py-3 d-flex flex-column flex-md-row justify-content-between align-items-md-center">
              <div class="d-flex align-items-center gap-3">
                <img src="${item.image}" alt="${item.name}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 12px;" />
                <div>
                  <h6 class="fw-bold mb-1">${item.name}</h6>
                  <p class="text-muted mb-0">$${item.price} each</p>
                </div>
              </div>
              <div class="d-flex align-items-center gap-3 mt-3 mt-md-0">
                <button class="btn btn-outline-secondary btn-sm decrease" data-name="${item.name}">-</button>
                <span class="fw-semibold">${item.quantity}</span>
                <button class="btn btn-outline-secondary btn-sm increase" data-name="${item.name}">+</button>
                <span class="fw-bold">$${item.price * item.quantity}</span>
              </div>
            </div>`;
        }).join('');
        summaryItems.textContent = itemCount;
        summaryTotal.textContent = `$${total}`;
        updateCartBadge();
      }
      document.addEventListener('click', function (event) {
        const target = event.target;
        if (target.classList.contains('increase')) {
          const cart = getCart();
          const item = cart.find((entry) => entry.name === target.dataset.name);
          if (item) item.quantity += 1;
          saveCart(cart);
          renderCart();
        }
        if (target.classList.contains('decrease')) {
          const cart = getCart();
          const item = cart.find((entry) => entry.name === target.dataset.name);
          if (item) {
            item.quantity -= 1;
            if (item.quantity <= 0) {
              const updated = cart.filter((entry) => entry.name !== target.dataset.name);
              saveCart(updated);
            } else {
              saveCart(cart);
            }
            renderCart();
          }
        }
      });
      document.getElementById('clearCart').addEventListener('click', function () {
        saveCart([]);
        renderCart();
      });
      renderCart();
      setUserGreeting();
    </script>
  </body>
</html>

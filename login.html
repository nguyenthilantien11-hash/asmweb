<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | NovaPhone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%); }
      .navbar-brand { font-weight: 800; color: #2563eb !important; }
      .auth-card { border: 0; border-radius: 1.4rem; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.12); }
      .form-control:focus { border-color: #2563eb; box-shadow: none; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">NovaPhone</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span id="cartCount" class="badge bg-primary">0</span></a></li>
          </ul>
          <div id="navUser" class="text-muted small"></div>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="auth-card card p-4 p-lg-5">
            <h2 class="fw-bold mb-3">Welcome back</h2>
            <p class="text-muted">Sign in to continue shopping and manage your account.</p>
            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label" for="rememberMe">Keep me signed in</label>
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
              <div id="loginAlert" class="alert alert-danger mt-3 d-none"></div>
            </form>
            <p class="text-center mt-3 mb-0">New here? <a href="register.html" class="text-decoration-none text-primary">Create an account</a></p>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
      <div class="container text-center text-md-start">
        <div class="row">
          <div class="col-md-6">
            <h5>NovaPhone</h5>
            <p class="text-white-50 mb-0">Modern mobile experiences for students, families, and professionals.</p>
          </div>
          <div class="col-md-6 text-md-end mt-3 mt-md-0">
            <a href="index.html" class="text-white-50 me-3">Home</a>
            <a href="contact.html" class="text-white-50 me-3">Contact</a>
            <a href="cart.html" class="text-white-50">Cart</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function getCart() {
        return JSON.parse(localStorage.getItem('novaCart') || '[]');
      }
      function updateCartBadge() {
        const count = getCart().length;
        const badge = document.getElementById('cartCount');
        if (badge) badge.textContent = count;
      }
      function setUserGreeting() {
        const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
        const box = document.getElementById('navUser');
        if (box) {
          box.innerHTML = user ? `Welcome, <strong>${user.fullName}</strong>` : 'Guest access enabled';
        }
      }
      document.getElementById('loginForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const alertBox = document.getElementById('loginAlert');
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email || !password) {
          alertBox.className = 'alert alert-danger mt-3';
          alertBox.textContent = 'Please enter both your email and password.';
          return;
        }
        if (!emailPattern.test(email)) {
          alertBox.className = 'alert alert-danger mt-3';
          alertBox.textContent = 'Please enter a valid email address.';
          return;
        }
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const foundUser = users.find((user) => user.email === email && user.password === password);
        if (!foundUser) {
          alertBox.className = 'alert alert-danger mt-3';
          alertBox.textContent = 'No matching account found. Check your credentials or create a new account.';
          return;
        }
        localStorage.setItem('currentUser', JSON.stringify(foundUser));
        alertBox.className = 'alert alert-success mt-3';
        alertBox.textContent = 'Login successful. Redirecting to your profile...';
        setTimeout(() => window.location.href = 'profile.html', 1000);
      });
      updateCartBadge();
      setUserGreeting();
    </script>
  </body>
</html>

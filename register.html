<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - NovaPhone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #020617, #111827 50%, #0f172a);
        color: #e2e8f0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .auth-card {
        border-radius: 1.5rem;
        background: rgba(15, 23, 42, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 18px 40px rgba(2, 8, 23, 0.4);
      }
      .form-control {
        background: rgba(2, 6, 23, 0.8);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .form-control:focus {
        background: rgba(2, 6, 23, 0.95);
        color: white;
        box-shadow: 0 0 0 0.2rem rgba(34, 211, 238, 0.25);
      }
      .auth-menu-wrapper {
        position: relative;
        display: inline-block;
      }
      .auth-menu-panel {
        position: absolute;
        top: calc(100% + 0.6rem);
        right: 0;
        min-width: 240px;
        padding: 0.9rem;
        border-radius: 1rem;
        background: rgba(2, 6, 23, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 32px rgba(2, 8, 23, 0.35);
        display: none;
        z-index: 1050;
      }
      .auth-menu-wrapper:hover .auth-menu-panel,
      .auth-menu-wrapper:focus-within .auth-menu-panel {
        display: block;
      }
      .auth-profile-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.55rem 0.85rem;
        border-radius: 999px;
        border: 1px solid rgba(34, 211, 238, 0.25);
        background: rgba(34, 211, 238, 0.15);
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-phone-fill"></i> NovaPhone</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
          </ul>
          <div class="d-flex gap-2 align-items-center">
            <a class="btn btn-outline-light" href="cart.html">Cart <span class="badge text-bg-light" id="cartCount">0</span></a>
            <div id="authContainer"></div>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="auth-card p-4 p-lg-5">
            <h1 class="h3 fw-bold text-center mb-3">Create your account</h1>
            <p class="text-secondary text-center mb-4">Join NovaPhone to save your profile and manage orders more easily.</p>
            <form id="registerForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full name</label>
                  <input type="text" class="form-control" id="fullName" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="tel" class="form-control" id="phone" required />
                </div>
                <div class="col-12">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Confirm password</label>
                  <input type="password" class="form-control" id="confirmPassword" required />
                </div>
                <div class="col-12">
                  <label class="form-label">Address</label>
                  <textarea class="form-control" rows="3" id="address" required></textarea>
                </div>
              </div>
              <div class="d-grid mt-4">
                <button class="btn btn-info text-dark fw-semibold" type="submit">Register</button>
              </div>
            </form>
            <div class="alert alert-danger mt-3 d-none" id="registerError"></div>
            <div class="alert alert-success mt-3 d-none" id="registerSuccess"></div>
            <p class="text-center mt-3 mb-0">Already registered? <a href="login.html" class="text-info">Login here</a></p>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function getCart() {
        return JSON.parse(localStorage.getItem("cart") || "[]");
      }

      function renderCartCount() {
        const count = getCart().reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById("cartCount").textContent = count;
      }

      function getCurrentUser() {
        return JSON.parse(localStorage.getItem("currentUser") || "null");
      }

      function renderAuthMenu() {
        const container = document.getElementById("authContainer");
        if (!container) return;

        const currentUser = getCurrentUser();
        if (currentUser) {
          container.innerHTML = `
            <div class="auth-menu-wrapper">
              <button class="auth-profile-pill btn" type="button">
                <i class="bi bi-person-circle"></i>
                <span>${currentUser.fullName.split(" ")[0]}</span>
              </button>
              <div class="auth-menu-panel">
                <div class="fw-semibold">${currentUser.fullName}</div>
                <div class="small text-secondary mb-2">${currentUser.email}</div>
                <div class="small text-secondary mb-3">${currentUser.phone || "No phone provided"}</div>
                <a class="btn btn-sm btn-outline-light w-100 mb-2" href="profile.html">View profile</a>
                <button class="btn btn-sm btn-danger w-100" id="logoutBtn">Logout</button>
              </div>
            </div>
          `;

          const logoutButton = container.querySelector("#logoutBtn");
          if (logoutButton) {
            logoutButton.addEventListener("click", function () {
              localStorage.removeItem("currentUser");
              renderAuthMenu();
            });
          }
        } else {
          container.innerHTML = `
            <div class="d-flex gap-2">
              <a class="btn btn-warning" href="login.html">Login</a>
              <a class="btn btn-outline-light" href="register.html">Create account</a>
            </div>
          `;
        }
      }

      document.getElementById("registerForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const fullName = document.getElementById("fullName").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();
        const address = document.getElementById("address").value.trim();
        const errorBox = document.getElementById("registerError");
        const successBox = document.getElementById("registerSuccess");

        errorBox.classList.add("d-none");
        successBox.classList.add("d-none");

        if (!fullName || !phone || !email || !password || !confirmPassword || !address) {
          errorBox.classList.remove("d-none");
          errorBox.textContent = "All fields are required.";
          return;
        }

        if (password.length < 6) {
          errorBox.classList.remove("d-none");
          errorBox.textContent = "Password must be at least 6 characters.";
          return;
        }

        if (password !== confirmPassword) {
          errorBox.classList.remove("d-none");
          errorBox.textContent = "Passwords do not match.";
          return;
        }

        const users = JSON.parse(localStorage.getItem("users") || "[]");
        const exists = users.some((user) => user.email === email);
        if (exists) {
          errorBox.classList.remove("d-none");
          errorBox.textContent = "An account already exists with this email.";
          return;
        }

        const newUser = { fullName, phone, email, password, address };
        users.push(newUser);
        localStorage.setItem("users", JSON.stringify(users));
        localStorage.setItem("currentUser", JSON.stringify(newUser));
        successBox.classList.remove("d-none");
        successBox.textContent = "Registration success! Redirecting to your profile...";
        setTimeout(() => {
          window.location.href = "profile.html";
        }, 1200);
      });

      renderCartCount();
      renderAuthMenu();
    </script>
  </body>
</html>

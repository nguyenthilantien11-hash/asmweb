<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - NovaPhone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <style>
      body {
        background: linear-gradient(135deg, #020617, #111827 50%, #0f172a);
        color: #e2e8f0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .profile-card {
        background: rgba(15, 23, 42, 0.92);
        border-radius: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 18px 40px rgba(2, 8, 23, 0.4);
      }
      .form-control {
        background: rgba(2, 6, 23, 0.8);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .form-control:focus {
        background: rgba(2, 6, 23, 0.95);
        color: white;
        box-shadow: 0 0 0 0.2rem rgba(34, 211, 238, 0.25);
      }
      .auth-menu-wrapper {
        position: relative;
        display: inline-block;
      }
      .auth-menu-panel {
        position: absolute;
        top: calc(100% + 0.6rem);
        right: 0;
        min-width: 240px;
        padding: 0.9rem;
        border-radius: 1rem;
        background: rgba(2, 6, 23, 0.98);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 32px rgba(2, 8, 23, 0.35);
        display: none;
        z-index: 1050;
      }
      .auth-menu-wrapper:hover .auth-menu-panel,
      .auth-menu-wrapper:focus-within .auth-menu-panel {
        display: block;
      }
      .auth-profile-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.55rem 0.85rem;
        border-radius: 999px;
        border: 1px solid rgba(34, 211, 238, 0.25);
        background: rgba(34, 211, 238, 0.15);
        color: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-phone-fill"></i> NovaPhone</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
          </ul>
          <div class="d-flex gap-2 align-items-center">
            <a class="btn btn-outline-light" href="cart.html">Cart <span class="badge text-bg-light" id="cartCount">0</span></a>
            <div id="authContainer"></div>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="profile-card p-4 text-center">
            <i class="bi bi-person-circle display-1 text-info"></i>
            <h2 class="h4 mt-3" id="profileName">Your profile</h2>
            <p class="text-secondary" id="profileEmail"></p>
            <button class="btn btn-outline-info mt-2" id="logoutBtn">Logout</button>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="profile-card p-4">
            <h3 class="h4 mb-4">Edit your information</h3>
            <form id="profileForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full name</label>
                  <input type="text" class="form-control" id="fullName" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label>
                  <input type="tel" class="form-control" id="phone" required />
                </div>
                <div class="col-12">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" required />
                </div>
                <div class="col-12">
                  <label class="form-label">Address</label>
                  <textarea class="form-control" rows="3" id="address" required></textarea>
                </div>
              </div>
              <div class="d-flex gap-2 mt-4">
                <button class="btn btn-info text-dark fw-semibold" type="submit">Save changes</button>
                <a class="btn btn-outline-light" href="cart.html">View cart</a>
              </div>
            </form>
            <div class="alert alert-success mt-3 d-none" id="profileMessage"></div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function getCart() {
        return JSON.parse(localStorage.getItem("cart") || "[]");
      }

      function renderCartCount() {
        const count = getCart().reduce((sum, item) => sum + item.quantity, 0);
        document.getElementById("cartCount").textContent = count;
      }

      function getCurrentUser() {
        return JSON.parse(localStorage.getItem("currentUser") || "null");
      }

      function renderAuthMenu() {
        const container = document.getElementById("authContainer");
        if (!container) return;

        const currentUser = getCurrentUser();
        if (currentUser) {
          container.innerHTML = `
            <div class="auth-menu-wrapper">
              <button class="auth-profile-pill btn" type="button">
                <i class="bi bi-person-circle"></i>
                <span>${currentUser.fullName.split(" ")[0]}</span>
              </button>
              <div class="auth-menu-panel">
                <div class="fw-semibold">${currentUser.fullName}</div>
                <div class="small text-secondary mb-2">${currentUser.email}</div>
                <div class="small text-secondary mb-3">${currentUser.phone || "No phone provided"}</div>
                <a class="btn btn-sm btn-outline-light w-100 mb-2" href="profile.html">View profile</a>
                <button class="btn btn-sm btn-danger w-100" id="logoutBtn">Logout</button>
              </div>
            </div>
          `;

          const logoutButton = container.querySelector("#logoutBtn");
          if (logoutButton) {
            logoutButton.addEventListener("click", function () {
              localStorage.removeItem("currentUser");
              renderAuthMenu();
              window.location.href = "login.html";
            });
          }
        } else {
          container.innerHTML = `
            <div class="d-flex gap-2">
              <a class="btn btn-warning" href="login.html">Login</a>
              <a class="btn btn-outline-light" href="register.html">Create account</a>
            </div>
          `;
        }
      }

      function loadProfile() {
        const currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
        if (!currentUser) {
          window.location.href = "login.html";
          return;
        }
        document.getElementById("profileName").textContent = currentUser.fullName;
        document.getElementById("profileEmail").textContent = currentUser.email;
        document.getElementById("fullName").value = currentUser.fullName;
        document.getElementById("phone").value = currentUser.phone;
        document.getElementById("email").value = currentUser.email;
        document.getElementById("address").value = currentUser.address;
      }

      document.getElementById("profileForm").addEventListener("submit", function (event) {
        event.preventDefault();
        const currentUser = JSON.parse(localStorage.getItem("currentUser") || "null");
        if (!currentUser) return;

        const updatedUser = {
          ...currentUser,
          fullName: document.getElementById("fullName").value.trim(),
          phone: document.getElementById("phone").value.trim(),
          email: document.getElementById("email").value.trim(),
          address: document.getElementById("address").value.trim()
        };

        const users = JSON.parse(localStorage.getItem("users") || "[]");
        const index = users.findIndex((user) => user.email === currentUser.email);
        if (index >= 0) {
          users[index] = updatedUser;
          localStorage.setItem("users", JSON.stringify(users));
        }
        localStorage.setItem("currentUser", JSON.stringify(updatedUser));
        document.getElementById("profileName").textContent = updatedUser.fullName;
        document.getElementById("profileEmail").textContent = updatedUser.email;
        const message = document.getElementById("profileMessage");
        message.classList.remove("d-none");
        message.textContent = "Profile updated successfully.";
      });

      document.getElementById("logoutBtn").addEventListener("click", function () {
        localStorage.removeItem("currentUser");
        window.location.href = "login.html";
      });

      loadProfile();
      renderCartCount();
      renderAuthMenu();
    </script>
  </body>
</html>

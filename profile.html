<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | NovaPhone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%); }
      .navbar-brand { font-weight: 800; color: #2563eb !important; }
      .card { border: 0; box-shadow: 0 18px 42px rgba(15, 23, 42, 0.1); border-radius: 1.3rem; }
      .form-control:focus { border-color: #2563eb; box-shadow: none; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">NovaPhone</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
            <li class="nav-item"><a class="nav-link active" href="profile.html">Profile</a></li>
            <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span id="cartCount" class="badge bg-primary">0</span></a></li>
          </ul>
          <div id="navUser" class="text-muted small"></div>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card p-4">
            <h4 class="fw-bold">Your account</h4>
            <div id="profileSummary" class="mt-3"></div>
            <a href="cart.html" class="btn btn-primary mt-3">Open cart</a>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card p-4">
            <h4 class="fw-bold mb-4">Edit profile</h4>
            <form id="profileForm">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Full name</label>
                  <input type="text" class="form-control" id="fullName" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone number</label>
                  <input type="tel" class="form-control" id="phone" required />
                </div>
                <div class="col-12">
                  <label class="form-label">Email address</label>
                  <input type="email" class="form-control" id="email" required />
                </div>
                <div class="col-12">
                  <label class="form-label">Address</label>
                  <input type="text" class="form-control" id="address" required />
                </div>
                <div class="col-12">
                  <button type="submit" class="btn btn-primary">Save changes</button>
                </div>
                <div class="col-12">
                  <div id="profileAlert" class="alert alert-success d-none"></div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
      <div class="container text-center text-md-start">
        <div class="row">
          <div class="col-md-6">
            <h5>NovaPhone</h5>
            <p class="text-white-50 mb-0">Modern mobile experiences for students, families, and professionals.</p>
          </div>
          <div class="col-md-6 text-md-end mt-3 mt-md-0">
            <a href="index.html" class="text-white-50 me-3">Home</a>
            <a href="contact.html" class="text-white-50 me-3">Contact</a>
            <a href="cart.html" class="text-white-50">Cart</a>
          </div>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      function getCart() {
        return JSON.parse(localStorage.getItem('novaCart') || '[]');
      }
      function updateCartBadge() {
        const count = getCart().length;
        const badge = document.getElementById('cartCount');
        if (badge) badge.textContent = count;
      }
      function setUserGreeting() {
        const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
        const box = document.getElementById('navUser');
        if (box) {
          box.innerHTML = user ? `Welcome, <strong>${user.fullName}</strong>` : '<a href="login.html" class="text-decoration-none text-primary">Login first</a>';
        }
      }
      function renderProfile() {
        const user = JSON.parse(localStorage.getItem('currentUser') || 'null');
        const summary = document.getElementById('profileSummary');
        if (!user) {
          summary.innerHTML = '<p class="text-muted">No account detected. Please register or login first.</p>';
          return;
        }
        summary.innerHTML = `
          <p class="mb-2"><strong>Name:</strong> ${user.fullName}</p>
          <p class="mb-2"><strong>Email:</strong> ${user.email}</p>
          <p class="mb-2"><strong>Phone:</strong> ${user.phone}</p>
          <p class="mb-0"><strong>Address:</strong> ${user.address}</p>
        `;
        document.getElementById('fullName').value = user.fullName;
        document.getElementById('phone').value = user.phone;
        document.getElementById('email').value = user.email;
        document.getElementById('address').value = user.address;
      }
      document.getElementById('profileForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const email = document.getElementById('email').value.trim();
        const address = document.getElementById('address').value.trim();
        const alertBox = document.getElementById('profileAlert');
        if (!fullName || !phone || !email || !address) {
          alertBox.className = 'alert alert-danger';
          alertBox.textContent = 'All fields are required.';
          return;
        }
        const updatedUser = { fullName, phone, email, address, password: JSON.parse(localStorage.getItem('currentUser') || 'null').password };
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const index = users.findIndex((user) => user.email === updatedUser.email || user.email === JSON.parse(localStorage.getItem('currentUser') || 'null').email);
        if (index >= 0) {
          users[index] = { ...users[index], ...updatedUser };
          localStorage.setItem('users', JSON.stringify(users));
        }
        localStorage.setItem('currentUser', JSON.stringify(updatedUser));
        alertBox.className = 'alert alert-success';
        alertBox.textContent = 'Profile updated successfully.';
        renderProfile();
      });
      renderProfile();
      updateCartBadge();
      setUserGreeting();
    </script>
  </body>
</html>
